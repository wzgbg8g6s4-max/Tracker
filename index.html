<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Wins">
<link rel="manifest" href="manifest.json">
<title>Little Wins</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#252525;--muted:#777;--line:#e5e1d8;--accent:#667957;--soft:#edf1e8;--good:#4f7041}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:680px;margin:auto;padding:18px 16px calc(90px + env(safe-area-inset-bottom));padding-top:calc(18px + env(safe-area-inset-top))}
h1{font-size:30px;margin:4px 0}.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.nav button,.secondary,.weeknav button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 8px;font-weight:600}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}.card h2,.card h3{margin:0 0 12px}
.small{font-size:13px;color:var(--muted)}.progress{height:9px;background:#ece9e1;border-radius:99px;overflow:hidden;margin:10px 0 17px}.bar{height:100%;background:var(--accent);transition:.25s}
.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}.task:first-child{border-top:0}.box{width:25px;height:25px;border:2px solid #b9b5ab;border-radius:7px;display:grid;place-items:center;flex:none}.box.done{background:var(--accent);border-color:var(--accent);color:#fff}.label{font-size:16px}.tag{margin-left:auto;font-size:11px;color:var(--good);font-weight:700}
.exercise{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line)}.exercise:first-of-type{border-top:0}.exercise button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:700}.exercise button.done{background:var(--soft);border-color:#b8c7ae;color:var(--good)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.weeknav button{min-width:42px}.day{border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;background:#fff;cursor:pointer}.day.done{border-color:#b8c7ae;background:#fbfcf9}.dayhead{display:flex;justify-content:space-between;align-items:center}.dayname{font-weight:700}.mini{font-size:12px;color:var(--muted);margin-top:5px}
.stat{display:flex;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.stat:first-of-type{border-top:0}.bigstat{text-align:center;padding:8px 0 15px}.bigstat strong{font-size:36px}.achieved{color:var(--good);font-weight:700}
.historyrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.historyrow:first-child{border-top:0}.empty{text-align:center;color:var(--muted);padding:25px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.secondary{font-size:13px}.danger{color:#8a3c3c}
.toast{position:fixed;left:16px;right:16px;bottom:20px;background:#242424;color:#fff;border-radius:15px;padding:14px 16px;text-align:center;font-weight:700;display:none;z-index:20}.toast.show{display:block;animation:pop .2s}@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="app">
<h1>Little Wins</h1><div class="sub">Small wins. One day at a time.</div>
<div class="nav"><button id="todayBtn">Today</button><button id="weekBtn">This Week</button><button id="historyBtn">History</button></div>
<main id="app"></main>
</div><div id="toast" class="toast"></div>

<script>
const HABITS=[
["alarm","Get up when my alarm goes"],
["waterWork","Drink water before work"],
["waterLunch","Drink water before lunch"],
["waterDinner","Drink water before dinner"],
["waterBed","Drink water before bed"],
["move","Treadmill / walk"],
["housework","Do some housework"]
];
const KEY="littleWins_final_v1";
let state=JSON.parse(localStorage.getItem(KEY)||'{"days":{},"celebrated":{}}');
let view="today", selectedDate=iso(new Date()), weekOffset=0, showAllHistory=false;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){let a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){let d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function monday(s){let d=parse(s),x=d.getDay();d.setDate(d.getDate()-(x===0?6:x-1));return iso(d)}
function fmt(s){return parse(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}
function short(s){return parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function day(s){return state.days[s] ||= {alarm:false,waterWork:false,waterLunch:false,waterDinner:false,waterBed:false,move:false,housework:false,run:false,gym:false}}
function satisfied(d,h){return h==="move" ? (!!d.move||!!d.run) : !!d[h]}
function dailyCount(s){let d=day(s);return HABITS.filter(x=>satisfied(d,x[0])).length}
function stats(ws){let run=0,gym=0,daily=0;for(let i=0;i<7;i++){let s=addDays(ws,i),d=day(s);run+=d.run?1:0;gym+=d.gym?1:0;daily+=dailyCount(s)}return{run,gym,daily,all:daily===49&&run===3&&gym===2}}
function toast(m){let t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("show"),1900)}
let audioCtx=null;
function playSound(big=false){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); const now=audioCtx.currentTime; const notes=big?[523.25,659.25,783.99,1046.5]:[659.25,783.99]; notes.forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=big?"sine":"triangle";o.frequency.value=freq;const t=now+i*(big?0.12:0.10);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(big?0.16:0.11,t+0.025);g.gain.exponentialRampToValueAtTime(0.0001,t+(big?0.28:0.18));o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+(big?0.32:0.22));});}catch(e){}}

function buzz(big){if(navigator.vibrate)navigator.vibrate(big?[100,70,180,70,260]:[70])}
function celebrate(id,msg,big=false){if(state.celebrated[id])return;state.celebrated[id]=true;save();toast(msg);buzz(big);playSound(big)}
function check(s){
 let ws=monday(s),d=day(s);
 if(dailyCount(s)===7)celebrate("day:"+s,"✨ Day complete!");
 for(let h of HABITS){let ok=true;for(let i=0;i<7;i++)if(!satisfied(day(addDays(ws,i)),h[0]))ok=false;if(ok)celebrate("habit:"+ws+":"+h[0],"✨ "+h[1]+" — 7/7!")}
 if(stats(ws).all)celebrate("big:"+ws,"🎉 WEEK ACHIEVED! 100% complete!",true)
}
function toggleHabit(s,h){day(s)[h]=!day(s)[h];save();check(s);render()}
function toggleExercise(s,h){day(s)[h]=!day(s)[h];save();check(s);render()}
function tasks(s){let d=day(s);return HABITS.map(([h,label])=>{let done=satisfied(d,h),auto=h==="move"&&d.run&&!d.move;return `<div class="task" onclick="toggleHabit('${s}','${h}')"><div class="box ${done?'done':''}">${done?'✓':''}</div><span class="label">${label}</span>${auto?'<span class="tag">RUN</span>':''}</div>`}).join("")}
function exercise(label,h,n,target){return `<div class="exercise"><div><strong>${label}</strong><div class="small">${n}/${target} this week</div></div><button class="${day(selectedDate)[h]?'done':''}" onclick="toggleExercise('${selectedDate}','${h}')">${day(selectedDate)[h]?'✓ Done':'Mark done'}</button></div>`}

function customTasks(){state.customTasks ||= [];return state.customTasks}
function customDone(date,id){return !!((state.customDone||{})[date]||{})[id]}
function toggleCustom(date,id){state.customDone ||= {};state.customDone[date] ||= {};state.customDone[date][id]=!state.customDone[date][id];save();render()}
function addCustomTask(){const i=document.getElementById("newCustomTask"),n=(i?.value||"").trim();if(!n)return;state.customTasks ||= [];state.customTasks.push({id:"ct_"+Date.now(),name:n});save();render()}
function removeCustomTask(id){state.customTasks=(state.customTasks||[]).filter(t=>t.id!==id);if(state.customDone)Object.keys(state.customDone).forEach(d=>{if(state.customDone[d])delete state.customDone[d][id]});save();render()}
function renderCustomTasks(date){
 const tasks=customTasks();
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
 const rows=tasks.map(t=>{const done=customDone(date,t.id);return `<div class="row"><button class="check ${done?'done':''}" onclick="toggleCustom('${date}','${t.id}')">${done?'✓':''}</button><div class="${done?'doneText':''}">${esc(t.name)}</div><button class="icon danger" onclick="removeCustomTask('${t.id}')">×</button></div>`}).join("");
 return `<div class="card"><h3>Extra tasks</h3><p class="muted">Optional tasks you can add whenever you need them. They are independent and don't affect your weekly score or achievements.</p>${rows}<div class="controls"><input id="newCustomTask" placeholder="Add a new task…" onkeydown="if(event.key==='Enter')addCustomTask()"><button onclick="addCustomTask()">Add</button></div></div>`;
}

function renderToday(){
 let s=selectedDate,n=dailyCount(s),st=stats(monday(s));
 document.getElementById("app").innerHTML=`
 <div class="card"><div class="small">Today</div><h2>${fmt(s)}</h2><div class="small">${n}/7 daily habits</div>
 <div class="progress"><div class="bar" style="width:${n/7*100}%"></div></div>${tasks(s)}</div>
 <div class="card"><h3>This week's exercise</h3>
 ${exercise("Run","run",st.run,3)}${exercise("Gym","gym",st.gym,2)}
 </div>`;
  el.innerHTML += renderCustomTasks(selectedDate);
}
function renderWeek(){
 let ws=addDays(monday(selectedDate),weekOffset*7),st=stats(ws),rows="";
 for(let i=0;i<7;i++){let s=addDays(ws,i),n=dailyCount(s),d=day(s);
 rows+=`<div class="day ${n===7?'done':''}" onclick="selectedDate='${s}';view='today';weekOffset=0;render()">
 <div class="dayhead"><span class="dayname">${parse(s).toLocaleDateString("en-GB",{weekday:"long"})}</span><span>${n}/7</span></div>
 <div class="mini">${short(s)} · ${d.run?'Run ✓':'Run —'} · ${d.gym?'Gym ✓':'Gym —'}</div></div>`}
 document.getElementById("app").innerHTML=`
 <div class="card"><div class="weeknav"><button onclick="weekOffset--;render()">‹</button><strong>${short(ws)} – ${short(addDays(ws,6))}</strong><button onclick="weekOffset++;render()">›</button></div>
 <div class="small">Tap any day to edit its habits and exercise</div>${rows}</div>
 <div class="card"><h3>Week progress</h3>
 <div class="stat"><span>Daily habits</span><strong>${st.daily}/49</strong></div>
 <div class="stat"><span>Runs</span><strong>${st.run}/3</strong></div>
 <div class="stat"><span>Gym</span><strong>${st.gym}/2</strong></div>
 <div class="stat"><span>Overall</span><strong class="${st.all?'achieved':''}">${st.all?'🎉 100%':'In progress'}</strong></div></div>`;
}
function streak(){
 let s=monday(iso(new Date())),n=0;
 if(stats(s).all)s=addDays(s,-7);
 while(n<52&&stats(s).all){n++;s=addDays(s,-7)}
 return n;
}
function renderHistory(){const el=document.getElementById("content"),currentStart=weekStart(new Date()),maxWeeks=showAllHistory?520:16;let rows=[];for(let i=1;i<=maxWeeks;i++){const ws=new Date(currentStart);ws.setDate(ws.getDate()-i*7);const w=iso(ws),ss=stats(w);if(ss.daily>0||ss.run>0||ss.gym>0)rows.push({w,s:ss});}const perfect=rows.filter(x=>x.s.all).length;const streakNow=streak();let body=rows.map(x=>{const label=new Date(x.w+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});return `<div class="row"><div><strong>${label}</strong><div class="muted">${x.s.daily}/49 daily · ${x.s.run}/3 runs · ${x.s.gym}/2 gym</div></div><div class="pill">${x.s.all?"✓ 100%":Math.round(x.s.pct)+"%"}</div></div>`}).join("");if(!body)body='<p class="muted">No completed weeks recorded yet.</p>';el.innerHTML=`<div class="card"><h2>History</h2><p class="muted">${showAllHistory?"All available history (up to 10 years shown)":"Most recent 16 weeks"}</p><div class="statgrid"><div><b>${streakNow}</b><span>Perfect-week streak</span></div><div><b>${perfect}</b><span>Perfect weeks shown</span></div></div><div class="history">${body}</div>${!showAllHistory?'<div class="controls"><button class="secondary" onclick="showAllHistory=true;render()">Show more history</button></div>':''}</div><div class="card"><h3>Testing</h3><button class="danger" onclick="resetData()">Reset all data</button></div>`;}

function resetData(){if(confirm("Reset all Little Wins data on this device?")){localStorage.removeItem(KEY);location.reload()}}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));document.getElementById(view==="today"?"todayBtn":view==="week"?"weekBtn":"historyBtn").classList.add("active");if(view==="today")renderToday();else if(view==="week")renderWeek();else renderHistory()}
todayBtn.onclick=()=>{view="today";render()};weekBtn.onclick=()=>{view="week";render()};historyBtn.onclick=()=>{view="history";showAllHistory=false;render()};
window.toggleHabit=toggleHabit;window.toggleExercise=toggleExercise;window.render=render;window.resetData=resetData;
render();
</script>
</body>
</html>
